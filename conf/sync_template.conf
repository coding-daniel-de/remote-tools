# Eine Gegenstelle für sync-send und sync-fetch. Kopieren nach conf/sync_<name>.conf (der Name ist
# das, was man bei sync-send/sync-fetch als <gegenstelle> angibt):
#   cp conf/sync_template.conf conf/sync_projekt-live.conf
#
# Verbindungsdaten (Host, User, Port, Key) stehen NICHT hier, sondern als Alias in ~/.ssh/config.
# Passwoerter gehoeren nie in diese Datei.

# Alias aus ~/.ssh/config. Leer lassen (oder Zeile loeschen), wenn die Gegenstelle nur ein anderer
# Ordner auf diesem Server ist, dann ist REMOTE_BASE_DIR Pflicht.
SSH_HOST="projekt-live"

# Basis der Gegenstelle. Mit SSH optional (Standard: Home der Gegenstelle), sonst Pflicht und ABSOLUT
# (z. B. /var/www/stage). Keine Tilde verwenden (Bash loest ~ in Anfuehrungszeichen nicht auf).
REMOTE_BASE_DIR=""

# Nur fuer t3-fs-*: fileadmin dieser Maschine, relativ zum Home (z. B. public/fileadmin).
LOCAL_FILEADMIN_DIR=""

# Nur fuer t3-fs-*: fileadmin der Gegenstelle, relativ zu REMOTE_BASE_DIR bzw. zum Home der Gegenstelle.
REMOTE_FILEADMIN_DIR=""

# Nur fuer t3-fs-*: zusaetzliche rsync-Excludes, durch Leerzeichen getrennt (z. B. "_temp_ _processed_").
EXTRA_EXCLUDES=""

# Ersetzt die Standard-rsync-Optionen (-rlt --partial). Leer = Standard.
RSYNC_OPTS=""
